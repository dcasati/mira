apiVersion: v1
kind: ConfigMap
metadata:
  name: mira-config
  namespace: mira
data:
  MIRA_WAKE_WORD: "MIRA,MEERA,MYRA,MIRAH,MEARA,OPERATOR"
  # Raised from 45s on 2026-08-17: a cold Foundry hosted-agent call
  # (query_foundry_iq_manuals) can take 35-56s end to end, which meant the
  # conversation could expire at or before the answer came back, leaving
  # no window for a natural follow-up. See internal/config/config.go's
  # Config.ConversationTimeout doc comment.
  MIRA_CONVERSATION_TIMEOUT: "120s"
  MIRA_WHISPER_MODEL_PATH: "/models/ggml-tiny.en.bin"
  MIRA_MAX_RX_SECONDS: "60"
  MIRA_MAX_TX_SECONDS: "60"
  ZELLO_ENDPOINT: "wss://zello.io/ws"
  AZURE_OPENAI_ENDPOINT: "https://instance-openai-dc.openai.azure.com"
  AZURE_OPENAI_REALTIME_DEPLOYMENT: "mira-gpt-realtime-mini"
  AZURE_OPENAI_REALTIME_VOICE: "echo"
  MIRA_LOOKUP_FILLER: "Standby."
  # POC telemetry tools are disabled until these three Fabric/Eventhouse values are set.
  # FABRIC_KQL_ENDPOINT: "https://<eventhouse-cluster>.kusto.fabric.microsoft.com"
  # FABRIC_KQL_DATABASE: "<kql-database-name>"
  # FABRIC_KQL_TABLE: "Telemetry"
  MIRA_TELEMETRY_TIME_COLUMN: "Timestamp"
  MIRA_TELEMETRY_DEVICE_COLUMN: "DeviceId"
  MIRA_TELEMETRY_DEFAULT_LOOKBACK: "15m"
  MIRA_TELEMETRY_MAX_ROWS: "20"
  FOUNDRY_PROJECT_ENDPOINT: "https://admin-2434-resource.services.ai.azure.com/api/projects/admin-2434"
  FOUNDRY_IQ_AGENT_NAME: "operator-persona-agent"
  FOUNDRY_IQ_MAX_OUTPUT_CHARS: "6000"
  HTTP_LISTEN_ADDR: ":8080"
  LOG_LEVEL: "DEBUG"
