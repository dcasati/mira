apiVersion: v1
kind: ConfigMap
metadata:
  name: mira-config
  namespace: mira
data:
  MIRA_WAKE_WORD: "MIRA,MEERA,MYRA,MIRAH,MEARA,OPERATOR"
  MIRA_CONVERSATION_TIMEOUT: "45s"
  MIRA_WHISPER_MODEL_PATH: "/models/ggml-tiny.en.bin"
  MIRA_MAX_RX_SECONDS: "60"
  MIRA_MAX_TX_SECONDS: "60"
  ZELLO_ENDPOINT: "wss://zello.io/ws"
  AZURE_OPENAI_ENDPOINT: "https://instance-openai-dc.openai.azure.com"
  AZURE_OPENAI_REALTIME_DEPLOYMENT: "mira-gpt-realtime-mini"
  AZURE_OPENAI_REALTIME_VOICE: "echo"
  MIRA_LOOKUP_FILLER: "Standby."
  # POC telemetry tools are disabled until these three Fabric/Eventhouse values are set.
  # FABRIC_KQL_ENDPOINT: "https://<eventhouse-cluster>.kusto.fabric.microsoft.com"
  # FABRIC_KQL_DATABASE: "<kql-database-name>"
  # FABRIC_KQL_TABLE: "Telemetry"
  MIRA_TELEMETRY_TIME_COLUMN: "Timestamp"
  MIRA_TELEMETRY_DEVICE_COLUMN: "DeviceId"
  MIRA_TELEMETRY_DEFAULT_LOOKBACK: "15m"
  MIRA_TELEMETRY_MAX_ROWS: "20"
  # 2026-08-17: temporarily switched this live cluster to call the
  # Foundry-hosted operator-persona-agent (Option B) directly, to test
  # that path end-to-end instead of the in-cluster operator-agent-aks
  # (Option A) it normally uses. Known tradeoff: this adds ~16-20s of
  # gateway overhead on top of the agent's own ~11.6s of actual work (see
  # internal/foundryiq/client.go's Config doc comment) -- pre-flight test
  # via curl measured ~43s end-to-end for a simple question. mira-gateway's
  # workload identity (id-mira-gateway) already has "Foundry User" on this
  # project, so no RBAC changes were needed.
  #
  # To revert to the faster in-cluster path, remove
  # FOUNDRY_PROJECT_ENDPOINT/FOUNDRY_IQ_AGENT_NAME below and restore:
  #   FOUNDRY_IQ_DIRECT_ENDPOINT: "http://operator-agent-aks.operator-agent-aks.svc.cluster.local:8088"
  # (FOUNDRY_IQ_DIRECT_ENDPOINT takes priority in the Go client when set.)
  FOUNDRY_PROJECT_ENDPOINT: "https://admin-2434-resource.services.ai.azure.com/api/projects/admin-2434"
  FOUNDRY_IQ_AGENT_NAME: "operator-persona-agent"
  FOUNDRY_IQ_MAX_OUTPUT_CHARS: "6000"
  HTTP_LISTEN_ADDR: ":8080"
  LOG_LEVEL: "DEBUG"
