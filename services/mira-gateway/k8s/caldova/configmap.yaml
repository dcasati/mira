apiVersion: v1
kind: ConfigMap
metadata:
  name: mira-config
  namespace: mira
data:
  MIRA_WAKE_WORD: "MIRA,MEERA,MYRA,MIRAH,MEARA,OPERATOR"
  MIRA_CONVERSATION_TIMEOUT: "120s"
  MIRA_WHISPER_MODEL_PATH: "/models/ggml-tiny.en.bin"
  MIRA_MAX_RX_SECONDS: "60"
  MIRA_MAX_TX_SECONDS: "60"
  ZELLO_ENDPOINT: "wss://zello.io/ws"
  # AIServices-kind Foundry account: the Realtime WebSocket endpoint lives
  # at <account>.cognitiveservices.azure.com, NOT <account>.openai.azure.com
  # (that subdomain doesn't resolve for this account kind -- confirmed by
  # direct testing during setup, 2026-09-01).
  AZURE_OPENAI_ENDPOINT: "https://ai-waypoint-agents-rxhrdaxs-b859df90.cognitiveservices.azure.com"
  AZURE_OPENAI_REALTIME_DEPLOYMENT: "mira-gpt-realtime-mini"
  AZURE_OPENAI_REALTIME_VOICE: "echo"
  MIRA_LOOKUP_FILLER: "Standby."
  # Points at operator-router, a new Foundry hosted agent (see
  # services/operator-agent/src/operator-router/) that classifies the
  # question and calls whichever of the Waypoint specialist agents
  # (assurance-orchestrator, collaboration-evidence-expert) actually owns
  # it -- mira-gateway itself only ever talks to this one agent name.
  FOUNDRY_PROJECT_ENDPOINT: "https://ai-waypoint-agents-rxhrdaxs-b859df90.services.ai.azure.com/api/projects/ai-project-waypoint-agents-rxhrdaxs"
  FOUNDRY_IQ_AGENT_NAME: "operator-router"
  FOUNDRY_IQ_MAX_OUTPUT_CHARS: "6000"
  HTTP_LISTEN_ADDR: ":8080"
  LOG_LEVEL: "DEBUG"
