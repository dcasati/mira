apiVersion: v1
kind: ConfigMap
metadata:
  name: mira-config
  namespace: mira
data:
  MIRA_WAKE_WORD: "MIRA,MEERA,MYRA,MIRAH,MEARA,OPERATOR"
  MIRA_CONVERSATION_TIMEOUT: "120s"
  MIRA_WHISPER_MODEL_PATH: "/models/ggml-tiny.en.bin"
  MIRA_MAX_RX_SECONDS: "60"
  MIRA_MAX_TX_SECONDS: "60"
  ZELLO_ENDPOINT: "wss://zello.io/ws"
  # AIServices-kind Foundry account: the Realtime WebSocket endpoint lives
  # at <account>.cognitiveservices.azure.com, NOT <account>.openai.azure.com
  # (that subdomain doesn't resolve for this account kind -- confirmed by
  # direct testing during setup, 2026-09-01).
  AZURE_OPENAI_ENDPOINT: "https://ai-waypoint-agents-rxhrdaxs-b859df90.cognitiveservices.azure.com"
  AZURE_OPENAI_REALTIME_DEPLOYMENT: "mira-gpt-realtime-mini"
  AZURE_OPENAI_REALTIME_VOICE: "echo"
  MIRA_LOOKUP_FILLER: "Standby."
  # 2026-09-02: moved operator-router's own hosting from Foundry to AKS
  # (services/operator-agent/src/operator-router-aks/) -- live testing
  # measured 74-82s for EVERY call to the Foundry-hosted operator-router,
  # even warm-session calls with previous_response_id chained. Foundry
  # hosted-agent sandboxes have no pre-warm/min-instance option, so that
  # cost was unavoidable on every single voice question. This direct
  # in-cluster endpoint removes THAT hop's cold start entirely (mira calls
  # the pod directly, no per-call sandbox to provision) -- the two
  # downstream Waypoint agents this router calls (assurance-orchestrator,
  # collaboration-evidence-expert) remain Foundry-hosted and still
  # cold-start on their end; that's a separate, currently unaddressed cost
  # outside this change's scope (they're the Waypoint team's own agents,
  # not owned by this repo).
  FOUNDRY_IQ_DIRECT_ENDPOINT: "http://operator-router-aks.operator-router-aks.svc.cluster.local:8088"
  FOUNDRY_IQ_MAX_OUTPUT_CHARS: "6000"
  HTTP_LISTEN_ADDR: ":8080"
  LOG_LEVEL: "DEBUG"
