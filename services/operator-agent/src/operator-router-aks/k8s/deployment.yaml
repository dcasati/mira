apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-router-aks
  namespace: operator-router-aks
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: operator-router-aks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operator-router-aks
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: operator-router
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator-router
          image: acrmiracaldova.azurecr.io/operator-router-aks@sha256:f913a9d7b6c00e75a579be3a953c29e12a63b202b3cc44f6833e1176b8017801
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          env:
            # azure-ai-agentserver's internal state defaults to
            # ~/.agentserver, unwritable at filesystem root with no HOME
            # set for this non-root UID -- same fix as
            # operator-persona-agent-aks/k8s/deployment.yaml.
            - name: AGENTSERVER_STATE_ROOT
              value: /agentserver-state
            # See workiq_client.py: silent-only MSAL token refresh against
            # this mounted cache (operator-router-workiq-cache Secret).
            # No client secret needed -- this is a public-client app, the
            # cache carries the refresh token from the one-time device-code
            # sign-in. See docs/WORKIQ_SETUP.md.
            - name: WORKIQ_CACHE_PATH
              value: /workiq/cache.bin
          envFrom:
            - configMapRef:
                name: operator-router-config
          volumeMounts:
            - name: agentserver-state
              mountPath: /agentserver-state
            - name: workiq-cache
              mountPath: /workiq
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: agentserver-state
          emptyDir: {}
        - name: workiq-cache
          secret:
            secretName: operator-router-workiq-cache
---
apiVersion: v1
kind: Service
metadata:
  name: operator-router-aks
  namespace: operator-router-aks
spec:
  selector:
    app.kubernetes.io/name: operator-router-aks
  ports:
    - name: http
      port: 8088
      targetPort: 8088
