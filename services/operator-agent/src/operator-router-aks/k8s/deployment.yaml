apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-router-aks
  namespace: operator-router-aks
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: operator-router-aks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operator-router-aks
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: operator-router
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator-router
          image: acrmiracaldova.azurecr.io/operator-router-aks@sha256:0b1e742b31db48e09bca5a98ae205916329dcebc988508b30da456e477143f8b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          env:
            # azure-ai-agentserver's internal state defaults to
            # ~/.agentserver, unwritable at filesystem root with no HOME
            # set for this non-root UID -- same fix as
            # operator-persona-agent-aks/k8s/deployment.yaml.
            - name: AGENTSERVER_STATE_ROOT
              value: /agentserver-state
          envFrom:
            - configMapRef:
                name: operator-router-config
          volumeMounts:
            - name: agentserver-state
              mountPath: /agentserver-state
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: agentserver-state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: operator-router-aks
  namespace: operator-router-aks
spec:
  selector:
    app.kubernetes.io/name: operator-router-aks
  ports:
    - name: http
      port: 8088
      targetPort: 8088
