apiVersion: apps/v1
kind: Deployment
metadata:
  name: mira-gateway
  namespace: mira
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mira
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mira
        app.kubernetes.io/component: gateway
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: mira-gateway
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mira
          image: myregistryvkzd.azurecr.io/mira@sha256:3aab8cddb3b937304e32469756ce59c60429ed94761f4d4cd43bbd85bd99fd0a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mira-config
            - secretRef:
                name: mira-zello
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
